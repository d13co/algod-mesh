name: release

# Version tags (v1.2.3) publish a release with the linux amd64 and arm64
# binaries (which install.sh downloads) and .debs, move the stable branch to
# the tagged commit, so that the scripts install.sh fetches from stable match
# the released binary, and publish the .debs to https://apt.d13.co.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    if: github.repository == 'd13co/algod-mesh' || github.repository == 'd13co/algod-loadb-mesh' # the old name, until the repo is renamed
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release, and the stable push
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build stamps the version from git describe
          # make runs next; only the stable push below gets the write token.
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make lint
      - run: make test
      - run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
      # amd64 last: the version check below runs bin/algod-mesh.
      - name: Build the binaries and .debs
        env:
          GOOS: linux
        run: |
          mkdir -p dist
          for arch in arm64 amd64; do
            GOARCH=$arch make build
            cp bin/algod-mesh dist/algod-mesh-linux-$arch
            DEB_VERSION=${GITHUB_REF_NAME#v} ARCH=$arch nfpm pkg -p deb -t dist/
          done
          cd dist && sha256sum algod-mesh-linux-* *.deb > checksums.txt
      - name: Check the version is stamped
        run: |
          v=$(./bin/algod-mesh version | awk '{print $2}')
          [ "$v" = "${GITHUB_REF_NAME}" ] || { echo "binary says $v, tag is $GITHUB_REF_NAME"; exit 1; }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes dist/*
      - name: Move stable to the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        # Fast-forward only; fails if stable moved ahead.
        run: git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY" "HEAD:refs/heads/stable"

  # Separate from release so a failed publish can be re-run on its own.
  apt:
    needs: release
    environment: apt # holds the signing and R2 secrets; v* tags only, needs approval
    runs-on: ubuntu-latest
    concurrency: apt # one index rebuild at a time
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # apt-ftparchive, for apt-publish.sh: ubuntu-latest no longer has it from 26.04 on.
      - run: sudo apt-get update && sudo apt-get install -y apt-utils
      - name: Download the .debs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Exactly the .debs checksums.txt lists: sha256sum -c skips a file it doesn't list,
          # so a .deb attached to the release by hand would otherwise be signed into apt unchecked.
          gh release download "$GITHUB_REF_NAME" -D dist -p checksums.txt
          cd dist
          : > debs.sha256
          while read -r sum name; do
            f=${name#./}
            case "$f" in
              *[!A-Za-z0-9._+~-]* | "") echo "unexpected name in checksums.txt: $name"; exit 1 ;;
              algod-mesh_*.deb) ;;
              *) continue ;; # the binaries
            esac
            # </dev/null: gh must not read the rest of checksums.txt off the loop's stdin
            gh release download "$GITHUB_REF_NAME" -p "$f" </dev/null
            echo "$sum  $f" >> debs.sha256
          done < checksums.txt
          # One per arch. By glob, not the tag: nfpm names v1.2.3-rc1's .deb 1.2.3~rc1.
          for a in amd64 arm64; do
            set -- algod-mesh_*_$a.deb
            [ -f "$1" ] || set -- # no match leaves the pattern itself
            [ $# -eq 1 ] || { echo "checksums.txt lists $# .debs for $a, not one: $*"; exit 1; }
          done
          sha256sum -c debs.sha256
          rm debs.sha256
      - name: Import the signing subkey
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: echo "$APT_SIGNING_KEY" | gpg --batch --import
      - name: Publish to apt.d13.co
        env:
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          printf %s "$APT_SIGNING_PASSPHRASE" > "$RUNNER_TEMP/pass"
          GPG_PASSPHRASE_FILE=$RUNNER_TEMP/pass APT_REPO=$RUNNER_TEMP/apt .github/apt-publish.sh dist/*.deb
      - name: Check apt.d13.co lists the release
        run: |
          # each .deb published above, with the release's bytes
          for f in dist/*.deb; do
            v=$(dpkg-deb -f "$f" Version)
            a=$(dpkg-deb -f "$f" Architecture)
            sha=$(sha256sum "$f" | cut -d' ' -f1)
            # the query string skips a cached copy from before this publish
            got=$(curl -fsS "https://apt.d13.co/dists/stable/main/binary-$a/Packages?sha256=$sha" |
              awk -v fn="Filename: pool/algod-mesh_${v}_$a.deb" '
                BEGIN { RS = "" }
                { f = 0; s = ""; n = split($0, l, "\n")
                  for (i = 1; i <= n; i++) { if (l[i] == fn) f = 1; if (l[i] ~ /^SHA256: /) s = substr(l[i], 9) }
                  if (f) print s }')
            [ -n "$got" ] || { echo "no $v for $a"; exit 1; }
            [ "$got" = "$sha" ] || { echo "apt.d13.co lists $v for $a with SHA256 $got, the release's is $sha"; exit 1; }
          done
